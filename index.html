<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rui Mates | Cebado Realista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #5D3A1A;
            --accent: #D4A574;
            --dark: #1a0f08;
            --light: #fdf6ee;
            --water: #a5d6a7;
            --water-dark: #4a8c3f;
            --steam: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            overflow-x: hidden;
        }

        /* Hero */
        .hero {
            height: 100vh;
            background: radial-gradient(ellipse at center, #2d1a0e 0%, #1a0f08 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 50px rgba(212, 165, 116, 0.6);
        }

        .hero h1 span {
            background: linear-gradient(135deg, #D4A574, #F5E6D3, #D4A574);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #D4A574;
            text-align: center;
            animation: bounce 2s infinite;
        }

        /* Mate Section */
        .mate-section {
            min-height: 400vh;
            position: relative;
            background: linear-gradient(180deg, #1a0f08 0%, #2d1a0e 50%, #1a0f08 100%);
        }

        .mate-sticky {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mate-scene {
            position: relative;
            width: 500px;
            height: 500px;
        }

        /* Real mate image */
        .mate-real {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0vi2X8IPaC6GdmF1QIfvIUaP6ID9l9fSJGqv_L_StSu1PBZykmYkelRk&s=10');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            filter: brightness(1.1) contrast(1.2) saturate(1.3);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* Water overlay */
        .water-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .water-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, 
                rgba(200, 230, 201, 0.9) 0%, 
                rgba(129, 199, 132, 0.7) 40%,
                rgba(76, 175, 80, 0.6) 100%);
            border-radius: 0 0 50% 50%;
            transition: height 0.3s ease;
        }

        .water-shine {
            position: absolute;
            top: 0;
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: shineMove 3s ease-in-out infinite;
            opacity: 0;
        }

        /* Steam particles */
        .steam-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255,255,255,0.9) 0%, 
                rgba(255,255,255,0.3) 50%,
                transparent 70%);
            pointer-events: none;
            animation: steamRise linear infinite;
            filter: blur(15px);
        }

        /* Water drops */
        .water-drop {
            position: absolute;
            background: linear-gradient(180deg, 
                #e8f5e9 0%, 
                #81c784 50%, 
                #4a8c3f 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: dropFall ease-in infinite;
            pointer-events: none;
            filter: blur(1px);
            box-shadow: 0 0 10px rgba(129, 199, 132, 0.5);
        }

        /* Heat waves */
        .heat-wave {
            position: absolute;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            animation: heatExpand ease-out infinite;
            pointer-events: none;
        }

        /* Steam glow */
        .steam-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(ellipse, 
                rgba(255,255,255,0.3) 0%, 
                transparent 70%);
            filter: blur(20px);
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes steamRise {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--drift), -200px) scale(2);
                opacity: 0;
            }
        }

        @keyframes dropFall {
            0% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translateY(80px) scale(1);
                opacity: 0.8;
            }
        }

        @keyframes heatExpand {
            0% {
                transform: scale(0.5);
                opacity: 0.4;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        @keyframes shineMove {
            0%, 100% {
                transform: translateX(-50%);
                opacity: 0.3;
            }
            50% {
                transform: translateX(50%);
                opacity: 0.8;
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.5;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.5);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4A574, #F5E6D3);
            width: 0%;
            transition: width 0.1s;
        }

        @media (max-width: 768px) {
            .mate-scene {
                width: 300px;
                height: 300px;
            }
            .mate-real {
                width: 250px;
                height: 250px;
            }
            .water-overlay {
                width: 200px;
                height: 200px;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Progress bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Hero -->
    <section class="hero">
        <div>
            <h1>Rui<span>Mates</span></h1>
            <p style="text-align: center; color: #D4A574; margin-top: 1rem; font-size: 1.2rem;">La experiencia del mate perfecto</p>
        </div>
        <div class="scroll-indicator">
            <span>Bajá para cebar tu mate</span>
            <br>
            <i class="fas fa-chevron-down" style="font-size: 2rem;"></i>
        </div>
    </section>

    <!-- Mate Section -->
    <section class="mate-section" id="mateSection">
        <div class="mate-sticky">
            <div class="mate-scene">
                <!-- Steam glow -->
                <div class="steam-glow" id="steamGlow"></div>
                
                <!-- Real mate image -->
                <div class="mate-real"></div>
                
                <!-- Water overlay -->
                <div class="water-overlay">
                    <div class="water-fill" id="waterFill"></div>
                    <div class="water-shine" id="waterShine"></div>
                </div>
                
                <!-- Containers for particles -->
                <div id="steamContainer"></div>
                <div id="dropsContainer"></div>
                <div id="heatContainer"></div>
            </div>
        </div>
    </section>

    <script>
        const waterFill = document.getElementById('waterFill');
        const waterShine = document.getElementById('waterShine');
        const steamGlow = document.getElementById('steamGlow');
        const steamContainer = document.getElementById('steamContainer');
        const dropsContainer = document.getElementById('dropsContainer');
        const heatContainer = document.getElementById('heatContainer');
        const mateSection = document.getElementById('mateSection');
        const progressFill = document.getElementById('progressFill');

        // Create steam particle
        function createSteamParticle() {
            const particle = document.createElement('div');
            particle.className = 'steam-particle';
            const size = Math.random() * 40 + 30;
            const drift = (Math.random() - 0.5) * 100;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = (180 + Math.random() * 140) + 'px';
            particle.style.top = '180px';
            particle.style.setProperty('--drift', drift + 'px');
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
            steamContainer.appendChild(particle);
            
            setTimeout(() => particle.remove(), 5000);
        }

        // Create water drop
        function createWaterDrop() {
            const drop = document.createElement('div');
            drop.className = 'water-drop';
            const size = Math.random() * 6 + 4;
            drop.style.width = size + 'px';
            drop.style.height = (size * 1.5) + 'px';
            drop.style.left = (200 + Math.random() * 100) + 'px';
            drop.style.top = '100px';
            drop.style.animationDuration = (Math.random() * 0.8 + 0.4) + 's';
            dropsContainer.appendChild(drop);
            
            setTimeout(() => drop.remove(), 1500);
        }

        // Create heat wave
        function createHeatWave() {
            const wave = document.createElement('div');
            wave.className = 'heat-wave';
            const size = Math.random() * 30 + 20;
            wave.style.width = size + 'px';
            wave.style.height = size + 'px';
            wave.style.left = (200 + Math.random() * 100) + 'px';
            wave.style.top = (150 + Math.random() * 100) + 'px';
            wave.style.animationDuration = (Math.random() * 2 + 2) + 's';
            heatContainer.appendChild(wave);
            
            setTimeout(() => wave.remove(), 4000);
        }

        // Update mate state based on scroll
        function updateMateState() {
            const rect = mateSection.getBoundingClientRect();
            const totalHeight = mateSection.offsetHeight;
            const scrollProgress = Math.max(0, Math.min(1, (window.innerHeight - rect.top) / totalHeight));
            
            // Update progress bar
            progressFill.style.width = (scrollProgress * 100) + '%';
            
            // Water fill level (0 to 70% of container)
            const waterLevel = scrollProgress * 70;
            waterFill.style.height = waterLevel + '%';
            
            // Show shine when water is present
            if (waterLevel > 10) {
                waterShine.style.opacity = (waterLevel - 10) / 60;
            } else {
                waterShine.style.opacity = 0;
            }
            
            // Show glow when water is hot
            if (scrollProgress > 0.4) {
                steamGlow.style.opacity = (scrollProgress - 0.4) * 2;
            } else {
                steamGlow.style.opacity = 0;
            }
            
            // Generate effects based on scroll progress
            if (scrollProgress > 0.2 && scrollProgress < 0.6) {
                // Water is being poured
                if (Math.random() < 0.4) createWaterDrop();
            }
            
            if (scrollProgress > 0.4) {
                // Steam is rising
                if (Math.random() < 0.3) createSteamParticle();
                if (Math.random() < 0.1) createHeatWave();
            }
            
            // Continuous steam generation
            if (scrollProgress > 0.6 && Math.random() < 0.5) {
                createSteamParticle();
            }
        }

        // Scroll event
        window.addEventListener('scroll', updateMateState);

        // Initial state
        updateMateState();

        // Generate ambient steam on load
        setInterval(() => {
            const rect = mateSection.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
                const scrollProgress = (window.innerHeight - rect.top) / mateSection.offsetHeight;
                if (scrollProgress > 0.5 && Math.random() < 0.3) {
                    createSteamParticle();
                }
            }
        }, 2000);
    </script>
</body>
</html>
